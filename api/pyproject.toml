[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "studyforge-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3", "pydantic>=2.8,<3",
  "python-jose[cryptography]>=3.3,<4", "passlib[bcrypt]>=1.7,<2",
  "bcrypt>=4,<4.1", "email-validator>=2.2,<3", "google-genai>=1,<2", "pypdf>=5,<7", "python-docx>=1.1,<2", "python-multipart>=0.0.9,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
